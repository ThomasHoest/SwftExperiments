name: iOS Build

on:
  push:
    branches: [main, foundation-implementation]
    paths:
      - 'iOS/**'
  pull_request:
    branches: [main]
    paths:
      - 'iOS/**'

jobs:
  build:
    name: Build VoiceItAll
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Build
        run: |
          xcodebuild \
            -project iOS/VoiceItAll.xcodeproj \
            -scheme VoiceItAll \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -configuration Debug \
            build \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty

      - name: Run unit tests
        run: |
          xcodebuild \
            -project iOS/VoiceItAll.xcodeproj \
            -scheme VoiceItAll \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -configuration Debug \
            test \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty
        continue-on-error: true
