name: Voxio Telemetry Backend — CI/CD

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci-cd.yml'
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci-cd.yml'

permissions:
  contents: read
  pull-requests: read

env:
  WORKING_DIR: backend
  NODE_VERSION: '20'

jobs:
  lint:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Lint
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: ${{ env.WORKING_DIR }}/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ${{ env.WORKING_DIR }}
      - name: Lint
        run: pnpm lint
        working-directory: ${{ env.WORKING_DIR }}

  unit:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Unit tests
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: ${{ env.WORKING_DIR }}/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ${{ env.WORKING_DIR }}
      - name: Unit tests
        run: pnpm test:unit
        working-directory: ${{ env.WORKING_DIR }}

  build:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    needs: [lint, unit]
    runs-on: ubuntu-latest
    name: Build
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: ${{ env.WORKING_DIR }}/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ${{ env.WORKING_DIR }}
      - name: Build
        run: pnpm build
        working-directory: ${{ env.WORKING_DIR }}

  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    needs: [build]
    runs-on: ubuntu-latest
    name: Deploy
    outputs:
      static_web_app_url: ${{ steps.deploy.outputs.static_web_app_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Azure Static Web Apps
        id: deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: backend
          api_location: ""
          output_location: ""
          deployment_environment: ${{ (github.ref == 'refs/heads/develop' && 'staging') || '' }}

  migrate:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    needs: [deploy]
    runs-on: ubuntu-latest
    name: Run migrations
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: ${{ env.WORKING_DIR }}/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ${{ env.WORKING_DIR }}
      - name: Run migrations
        run: |
          # Only migrate on push or workflow_dispatch — not on PR events.
          # PRs deploy to ephemeral SWA preview environments which share
          # the staging DB; running migrations there would affect staging.
          if [ "$GITHUB_EVENT_NAME" == "pull_request" ]; then
            echo "Skipping migrations for pull_request event"
            exit 0
          fi
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL not configured — skipping (set GitHub secret after T-4104)"
            exit 0
          fi
          pnpm migrate:up
        working-directory: ${{ env.WORKING_DIR }}
        env:
          DATABASE_URL: ${{ (github.ref == 'refs/heads/main' && secrets.DATABASE_URL) || (github.ref == 'refs/heads/develop' && secrets.STAGING_DATABASE_URL) || '' }}

  e2e:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    needs: [migrate]
    runs-on: ubuntu-latest
    name: E2E tests
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: ${{ env.WORKING_DIR }}/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ${{ env.WORKING_DIR }}
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
        working-directory: ${{ env.WORKING_DIR }}
      - name: Run E2E tests
        run: pnpm test:e2e
        working-directory: ${{ env.WORKING_DIR }}
        env:
          PLAYWRIGHT_BASE_URL: >-
            ${{
              needs.deploy.outputs.static_web_app_url != '' && needs.deploy.outputs.static_web_app_url ||
              github.ref == 'refs/heads/main'    && vars.SWA_PRODUCTION_URL ||
              github.ref == 'refs/heads/develop' && vars.SWA_STAGING_URL    ||
              'http://localhost:3000'
            }}
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: ${{ env.WORKING_DIR }}/playwright-report/
          retention-days: 7

  cleanup_pr:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close PR environment
    steps:
      - name: Close Azure Static Web Apps staging environment
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
