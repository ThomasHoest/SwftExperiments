<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <filter id="sketch" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="4" seed="9" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.1" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="sketchHeavy" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.042" numOctaves="3" seed="4" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.7" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <rect width="900" height="680" fill="#FAFAF8"/>

  <text x="450" y="34" text-anchor="middle" font-size="15" font-weight="600" fill="#222" letter-spacing="0.5">Touch Playback Controls — v1.2 Sketch</text>
  <line x1="60" y1="46" x2="840" y2="46" stroke="#bbb" stroke-width="0.8" stroke-dasharray="4,3" filter="url(#sketch)"/>

  <!-- ═══════════════════════════
       LEFT — PLAYING STATE
       ═══════════════════════════ -->

  <text x="155" y="66" text-anchor="middle" font-size="11" font-weight="600" fill="#444" font-style="italic">Playing</text>

  <rect x="52" y="76" width="206" height="570" rx="28" fill="#1A1D26" stroke="#333" stroke-width="2" filter="url(#sketchHeavy)"/>
  <rect x="119" y="86" width="72" height="14" rx="7" fill="#111" filter="url(#sketch)"/>
  <text x="69" y="113" font-size="7" fill="#aaa">08.34</text>
  <text x="247" y="113" text-anchor="end" font-size="7" fill="#aaa">5G</text>

  <circle cx="76" cy="135" r="9" fill="none" stroke="#666" stroke-width="1" filter="url(#sketch)"/>
  <text x="76" y="139" text-anchor="middle" font-size="7.5" fill="#888">?</text>
  <rect x="112" y="127" width="86" height="18" rx="9" fill="#1E2235" stroke="#555" stroke-width="0.7" filter="url(#sketch)"/>
  <text x="155" y="140" text-anchor="middle" font-size="7" fill="#aaa">≈ 3 speakers</text>
