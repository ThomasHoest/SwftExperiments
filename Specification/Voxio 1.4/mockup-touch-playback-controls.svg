  <text x="155" y="502" text-anchor="middle" font-size="7" fill="#777" font-style="italic">Lytter…</text>
  <rect x="66" y="528" width="80" height="26" rx="13" fill="#1E2235" stroke="#555" stroke-width="0.7" filter="url(#sketch)"/>
  <text x="106" y="545" text-anchor="middle" font-size="7" fill="#aaa">Pejsestuen</text>
  <rect x="152" y="528" width="78" height="26" rx="13" fill="#1E2235" stroke="#C8A97E" stroke-width="0.9" filter="url(#sketch)"/>
  <text x="191" y="545" text-anchor="middle" font-size="7" fill="#C8A97E">Badeværelse</text>


