  <rect x="742" y="528" width="78" height="26" rx="13" fill="#1E2235" stroke="#C8A97E" stroke-width="0.9" filter="url(#sketch)"/>
  <text x="781" y="545" text-anchor="middle" font-size="7" fill="#C8A97E">Badeværelse</text>


  <!-- ═══════════════════════════
       ANNOTATIONS
       ═══════════════════════════ -->

  <!-- Playing — slider -->
  <line x1="133" y1="249" x2="90" y2="228" stroke="#999" stroke-width="0.8" stroke-dasharray="3,2" filter="url(#sketch)"/>
  <text x="50" y="226" font-size="8" fill="#555" font-style="italic">Interactive slider</text>
  <text x="50" y="237" font-size="8" fill="#555" font-style="italic">fires setVolume on release</text>

  <!-- Playing — button -->
  <line x1="258" y1="301" x2="302" y2="290" stroke="#999" stroke-width="0.8" stroke-dasharray="3,2" filter="url(#sketch)"/>
  <text x="304" y="288" font-size="8" fill="#555" font-style="italic">Single toggle ⏸/▶</text>
  <text x="304" y="299" font-size="8" fill="#555" font-style="italic">full-width · 52pt visual</text>
  <text x="304" y="310" font-size="8" fill="#555" font-style="italic">white when playing</text>

  <!-- Paused — gold -->
