  <rect x="186" y="338" width="34" height="22" rx="11" fill="#1E2235" stroke="#C8A97E" stroke-width="0.9" filter="url(#sketch)"/>
  <text x="203" y="353" text-anchor="middle" font-size="7" fill="#C8A97E">Jazz</text>

