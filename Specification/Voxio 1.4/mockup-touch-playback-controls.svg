  <!-- PLAYING CARD -->
  <rect x="66" y="158" width="178" height="260" rx="18" fill="#1E2235" stroke="#666" stroke-width="1" opacity="0.95" filter="url(#sketchHeavy)"/>

  <text x="80" y="184" font-size="11" font-weight="700" fill="#F0EDE8">Badeværelse</text>
  <text x="236" y="182" text-anchor="end" font-size="6.5" fill="#aaa">beolink</text>
  <text x="80" y="200" font-size="8" fill="#C8A97E">● Playing</text>

  <rect x="74" y="207" width="162" height="36" rx="8" fill="#FFF" fill-opacity="0.07" filter="url(#sketch)"/>
  <text x="84" y="222" font-size="8" fill="#EEE">DR P1</text>
  <text x="84" y="235" font-size="6.5" fill="#aaa">dr.dk/p1</text>
  <rect x="222" y="220" width="3" height="8" rx="1.5" fill="#C8A97E" filter="url(#sketch)"/>
  <rect x="227" y="215" width="3" height="13" rx="1.5" fill="#C8A97E" filter="url(#sketch)"/>
  <rect x="232" y="218" width="3" height="10" rx="1.5" fill="#C8A97E" filter="url(#sketch)"/>

