<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bang &amp; Olufsen · Voice</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Inter:wght@300;400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ── Landing ─────────────────────────────────────────────── -->
    <section id="view-landing" class="view active">
        <div class="landing">
            <p class="brand">Bang &amp; Olufsen</p>
            <h1>Speak.<br>Be heard.</h1>
            <p class="intro">
                A new way to experience your speakers.<br>
                Your voice, perfectly understood.
            </p>
            <button class="btn-primary" id="btn-try">Try it</button>
        </div>
    </section>

    <!-- ── Experience ──────────────────────────────────────────── -->
    <section id="view-experience" class="view">
        <div class="experience">

            <div class="orb-stage" id="orb-stage">
                <div class="ring" style="--i:0"></div>
                <div class="ring" style="--i:1"></div>
                <div class="ring" style="--i:2"></div>
                <div class="orb" id="orb"></div>
            </div>

            <p class="transcript" id="transcript"></p>
            <p class="mic-status" id="mic-status"></p>

            <button class="btn-back" id="btn-back">Back</button>
        </div>
    </section>

    <script src="app.js"></script>
</body>
</html>
