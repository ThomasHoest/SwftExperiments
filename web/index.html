<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice to Music</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Voice to Music</h1>
        <p class="subtitle">Control your speakers with your voice</p>

        <!-- Permissions -->
        <div class="permissions">
            <div class="permission-card" id="mic-card">
                <div class="permission-icon">🎤</div>
                <div class="permission-info">
                    <h3>Microphone</h3>
                    <p>Listen to your voice commands</p>
                </div>
                <button class="permission-btn" id="mic-btn">Allow</button>
            </div>

            <div class="permission-card" id="network-card">
                <div class="permission-icon">📡</div>
                <div class="permission-info">
                    <h3>Local Network</h3>
                    <p>Connect to speakers on your network</p>
                </div>
                <button class="permission-btn" id="network-btn">Configure</button>
            </div>
        </div>

        <!-- Speaker config (hidden until Configure is clicked) -->
        <div class="panel hidden" id="network-panel">
            <h3>Speaker Setup</h3>
            <div class="input-group">
                <label for="speaker-ip">IP Address</label>
                <input type="text" id="speaker-ip" placeholder="192.168.1.100" autocomplete="off" />
            </div>
            <div class="input-group">
                <label for="speaker-port">Port</label>
                <input type="number" id="speaker-port" value="1400" />
            </div>
            <button class="connect-btn" id="connect-btn">Connect to Speaker</button>
        </div>

        <!-- Transcription -->
        <div class="transcription-box" id="transcription-box">
            <p id="transcription-text">Press the button below and start speaking…</p>
        </div>

        <div class="status-row">
            <span class="status-text" id="status-text">Ready</span>
        </div>

        <button class="record-btn" id="record-btn">Start Listening</button>

        <!-- Connection indicator -->
        <div class="connection-status">
            <span class="dot" id="conn-dot"></span>
            <span id="conn-label">Speaker not configured</span>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
